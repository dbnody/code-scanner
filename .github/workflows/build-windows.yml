name: Build Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name MiaoMiaoScanner main.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: MiaoMiaoScanner-windows
          path: dist/MiaoMiaoScanner.exe
