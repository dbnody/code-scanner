name: Build Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --retries 5 --timeout 60 -r requirements.txt 2>&1 |
            Tee-Object -FilePath "$env:RUNNER_TEMP\pip.log"
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content "$env:RUNNER_TEMP\pip.log" -Tail 30) -join " | "
            Write-Host "::error::pip install failed: $tail"
            exit 1
          }

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean CodeScanner.spec

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: CodeScanner-windows
          path: dist/CodeScanner.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CodeScanner.exe
          generate_release_notes: true
